summary: >-
  W jakim miejscu jest biznes i gdzie zacząć techniczne modelowanie domeny? Odpowiedź na oba
  pytania jest jedna: mapy możliwości biznesowych. Rozkładamy je na przykładach McDonald's,
  platformy VOD, Netflixa i Ubera i pokazujemy, co z nich mają programiści i architekci.

lead: >-
  W jakim miejscu jest biznes i gdzie zacząć techniczne modelowanie domeny? Okazuje się, że
  odpowiedź na te dwa pytania jest jedna: mapy możliwości biznesowych. To temat, który brzmi
  jak rozmowa C-levelu, przy której deweloperzy ziewają, a w praktyce jest najstabilniejszym
  punktem zaczepienia dla modelu domenowego.

description: >-
  Zaczynamy od definicji: capability to to, co biznes robi u swoich podstaw (William Ulrich),
  a według BIZBOK konkretna zdolność, którą biznes może posiadać lub wymienić, żeby osiągnąć
  określony cel. Potem przykłady: Ray Kroc i McDonald's, który stoi na nieruchomościach i
  franczyzie, a nie na burgerach; platforma VOD, w której streaming jest domeną wspierającą,
  a o przewadze decyduje zakup i produkcja treści; Netflix, który capability tworzenia
  materiałów po prostu kupił razem ze studiami filmowymi. Modelujemy wymaganie „podcasty na
  platformie VOD w tydzień”: film, podcast i serial jako „materiał” ze ścieżkami audio i
  wideo, struktury wielkiej skali z Domain-Driven Design i klasa Podcast dziedzicząca po
  Video jako przykład, jak tego nie robić. Do tego capability jako heurystyka do odkrywania
  bounded contextów (nie mapowanie jeden do jednego), Uber i archetyp dostępności, poziomy
  dojrzałości capabilities w rozmowie z biznesem, capabilities strategiczne i mapy Wardleya.
  Na koniec zagadka: trzy capabilities z prawdziwego projektu i pytanie, jaka to branża.

