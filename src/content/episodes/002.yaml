summary: >-
  Serverless miał zdjąć z nas serwery, patche i skalowanie. Opowiadamy, co w praktyce
  poszło nie tak: cold start, DynamoDB używane jak baza relacyjna, kolejki bez Dead Letter
  Queue i Lambda pinball. I dlaczego Lambda to architektura wdrożenia, nie oprogramowania.

lead: >-
  Serverless miał zdjąć z nas serwery, patche i skalowanie. Artur opowiada z perspektywy
  audytora, który wchodzi w poobijane projekty na AWS, Kamil jako twórca systemu zbudowanego
  w całości na Lambdach. Dziś narzekamy, ale z miłością: AWS i Lambdy są świetne, jeśli
  wiesz, do czego ich używasz.

description: >-
  Zaczynamy od definicji z książki „Serverless Architectures on AWS” (płacisz tylko wtedy,
  gdy używasz) i plusów: nikt nie patchuje serwerów, jest SLA, a bezpieczeństwo usługi
  zarządzanej bije Kubernetesa na bare metal. Potem lista bólu: cold start w .NET i fakt, że
  od sierpnia 2025 AWS dolicza czas inicjalizacji Lambdy do rachunku; DynamoDB używane jak
  baza relacyjna; 50 funkcji z jednej DLL-ki i okno rozsynchronizowania przy deployu; SQS bez
  Dead Letter Queue i ETL-e, które nie przeżywają trzygodzinnej awarii Redshifta; Lambda
  pinball, czyli proces przechodzący przez 50 funkcji, kolejek i bucketów. Do tego prawo
  Teslera (złożoność nie znika, tylko przenosi się z serwerów do integracji), Lambda layers ze
  „shared kernelem” prowadzące do Distributed Big Ball of Mud i mikroserwis, który tylko
  kapitalizuje stringa. Teza odcinka: Lambda to architektura wdrożenia, nie architektura
  oprogramowania. Zasady projektowania się nie zmieniły.

