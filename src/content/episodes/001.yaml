summary: >-
  Dlaczego zaczynanie projektu od implementacji i frameworków generuje
  gigantyczny koszt koncepcyjny. Rola wspólnego języka i modelowania na papierze.

lead: >-
  O fizycznym szkicowaniu systemów, kosztach refaktoringu w chmurze i dlaczego
  ołówek 2B bije na głowę Confluence. W odcinku pilotażowym opowiadamy, skąd
  wziął się pomysł na podcast i co dokładnie rozumiemy przez „projektowanie
  sterowane papierem”.

description: >-
  Kamil i Artur przechodzą przez trzy prawdziwe projekty, w których pierwsze
  tygodnie spędzone przy klawiaturze zamiast przy tablicy kosztowały zespoły
  miesiące refaktoringu. Rozmawiamy o wspólnym języku, o tym, dlaczego diagram
  narysowany flamastrem jest tańszy od każdej linii kodu, i jak zacząć pracę na
  papierze w zespole, który „nie ma na to czasu”.

