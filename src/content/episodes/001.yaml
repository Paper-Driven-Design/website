description: >-
  Dla wielu inżynierów „kod to towar” brzmi jak ujma na honorze. Pokazujemy, że kod był
  towarem od dawna: outsourcing, package managery, open source, komponenty kupowane w paczkach,
  low-code i SaaS. Każdy z tych skoków przyspieszał pracę i jednocześnie podnosił złożoność
  systemów. Rozmawiamy o różnicy między kodowaniem a programowaniem, o tym, czy wpuszczać agenta
  AI do domeny core, i dlaczego Martin Fowler porównuje LLM-y do pierwszego kompilatora Fortrana.
  Są liczby: Windows urósł z 4-5 mln linii kodu w 1993 roku do prawie 30 mln w XP, Debian 4.0 miał
  300 mln linii, a według badań Hattona kod w systemie podwaja się średnio co 42 miesiące. Do tego
  prawa Lehmana, shift-left i definicja architektury jako decyzji trudnych do cofnięcia. Wniosek
  jest jeden: myślenia nie da się zdelegować do modelu.

