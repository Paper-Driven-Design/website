takeaways:
  - title: "Koszt błędu rośnie wykładniczo z każdym etapem"
    text: "Założenie obalone na papierze kosztuje godzinę. To samo założenie obalone po wdrożeniu kosztuje kwartał i zaufanie biznesu."
  - title: "Wspólny język to artefakt, nie slogan"
    text: "Jak zbudować słownik domeny, do którego naprawdę wracają programiści i ludzie biznesu."
  - title: "Rysunek jest tańszy od każdej linii kodu"
    text: "Dlaczego szkic na rolce papieru pakowego wygrywa z dokumentem w Confluence i diagramem w narzędziu do modelowania."
  - title: "Pierwszy krok w zespole, który „nie ma czasu”"
    text: "Protokół 90-minutowej sesji, którą da się przeprowadzić w każdym sprincie bez zgody zarządu."

