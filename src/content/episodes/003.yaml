takeaways:
  - title: "Capability to to, co biznes robi, a nie jak to robi"
    text: "Może je realizować człowiek, proces, maszyna albo kod. Dlatego mapa możliwości jest najstabilniejszym miejscem w biznesie: funkcje się zmieniają, a zdolność strumieniowania materiału zostaje ta sama dla filmu, serialu i podcastu."
  - title: "Technologia rzadko jest przewagą konkurencyjną"
    text: "McDonald's stoi na nieruchomościach i franczyzie, a platformy VOD nie wygrywają jakością streamingu, tylko treścią. Capability nie zawsze trzeba budować: Netflix zdolność produkcji filmów po prostu kupił."
  - title: "Capability to heurystyka, nie granica bounded contextu"
    text: "Mapowanie jeden do jednego jest dobre na start. Potem nakładamy inne heurystyki i modelujemy: jedno capability mogą realizować różne konteksty, a rzeczy takie jak dostępność zasobu w ogóle nie wynikają wprost z mapy."
  - title: "Mapa zaczyna rozmowę z biznesem"
    text: "Poziomy dojrzałości, capabilities strategiczne i mapy Wardleya pokazują, w jakim miejscu jest organizacja i co trzeba zmienić albo stworzyć pod nową funkcję. Zmiana systemu nie zawsze jest najtańszym sposobem."

