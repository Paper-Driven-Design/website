takeaways:
  - title: "Pułapka pozornego konsensusu w bankowości"
    text: "Dlaczego ludzie kiwają głowami przy tablicy, a w poniedziałek wracają do specyfikacji w Wordzie i obrony własnych stref wpływów."
  - title: "Architekt jako bezstronny facylitator, nie sędzia"
    text: "Techniki zadawania pytań bez defensywnej reakcji liderów domenowych. Jak wydobyć ukryte założenia bez eskalacji konfliktu."
  - title: "Zarządzanie silosami politycznymi i sabotażem"
    text: "Co zrobić, gdy kluczowy decydent ignoruje warsztat lub forsuje architekturę pod swoje KPI zamiast rzeczywistego przepływu zdarzeń."
  - title: "Przejście z Big Picture do Design-Level bez utraty pary"
    text: "Dokładny moment, w którym należy zwinąć papierową rolkę i przełożyć agregaty na Architecture Decision Records (ADR) oraz kod."

