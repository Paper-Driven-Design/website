takeaways:
  - title: "Kod był towarem na długo przed LLM-ami"
    text: "Outsourcing, package managery, open source, low-code i SaaS to kolejne fale tego samego zjawiska. AI tylko skraca pętlę zwrotną z tygodni do godzin."
  - title: "Kodowanie to nie programowanie"
    text: "Agent może klepać kod w domenach generycznych i wspierających. W domenie core nadal liczy się zrozumienie problemu, nie szybkość pisania."
  - title: "Każde przyspieszenie podnosi złożoność"
    text: "Windows, Debian i badania Hattona pokazują to samo: liczba linii kodu podwaja się co kilka lat, a bez pracy nad złożonością entropia rośnie (prawa Lehmana)."
  - title: "Architektura to decyzje trudne do cofnięcia"
    text: "Według Brooksa to właśnie one odróżniają architekturę od implementacji. LLM nie podejmie ich za Ciebie, a myślenia nie da się zdelegować."

