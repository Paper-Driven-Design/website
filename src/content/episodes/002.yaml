summary: >-
  Pułapka pozornego konsensusu na warsztatach Big Picture. Wnioski z sesji
  w bankowości i e-commerce oraz przełamywanie silosów politycznych.

lead: >-
  Zorganizowanie 30-osobowego warsztatu z przedstawicielami biznesu, compliance,
  bezpieczeństwa i zespołów inżynierskich wydaje się triumfem kolaboracji. Jednak
  w 8 na 10 korporacji Event Storming kończy się „pułapką pozornego konsensusu”:
  ściana oklejona pomarańczowymi karteczkami wygląda imponująco, ale w kodzie
  i architekturze nie zmienia się absolutnie nic.

description: >-
  W tym odcinku Kamil Kiełbasa i Artur Wojnar rozkładają na czynniki pierwsze
  dynamikę grupową, politykę korporacyjną i mikro-sabotaż, które pojawiają się na
  styku modelowania domenowego i starych struktur silosowych. Omawiamy realne
  wdrożenia z polskiego sektora bankowego, platform logistycznych oraz systemów
  transakcyjnych o skali milionów zdarzeń na dobę.

