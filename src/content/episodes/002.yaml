takeaways:
  - title: "Cold start to jedyny problem z natury serverlessa"
    text: "Reszta listy to skill issue: DynamoDB używane jak baza relacyjna, kolejki bez DLQ, brak alarmów. Trzeba znać narzędzie, zanim wprowadzi się je w organizacji."
  - title: "DynamoDB wymaga modelowania pod wzorce dostępu"
    text: "Partycje, hashowanie i router decydują, gdzie trafia zapytanie. Bez modelowania up front powstają gigantyczne tabele i frustracja, choć baza robi dokładnie to, do czego ją zaprojektowano."
  - title: "Złożoność nie znika, tylko się przenosi"
    text: "Prawo Teslera i Brooks: wyciągnęliśmy złożoność z zarządzania serwerami i wsadziliśmy ją w integrację między Lambdami, kolejkami i bucketami. Im więcej ruchomych elementów, tym więcej miejsc, gdzie giną dane."
  - title: "Lambda to architektura wdrożenia, nie oprogramowania"
    text: "Użycie Lambd nie daje mikroserwisów. Layers ze „shared kernelem” prowadzą do Distributed Big Ball of Mud. Najpierw projektujemy i modelujemy, potem decydujemy, jak to wdrożyć."

